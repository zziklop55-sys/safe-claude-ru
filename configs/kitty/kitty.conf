# Kitty: шрифт с Kubuntu, тема своя — тёмная нейтральная, без розового.
font_family      FantasqueSansM Nerd Font Mono
bold_font        auto
font_size        12.0
background_opacity 0.92
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
scrollback_lines 5000
copy_on_select clipboard

# Ctrl+Shift+C / Ctrl+Shift+V — копировать / вставить
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# --- цвета ---
foreground            #D4D4D8
background            #141318
selection_foreground  #141318
selection_background  #8B6CC9
cursor                #B79CFF
url_color             #7AA2F7

# чёрный
color0  #1E1D24
color8  #5C5A66
# красный
color1  #E06C75
color9  #F0868F
# зелёный
color2  #8CC085
color10 #A6D49F
# жёлтый
color3  #D9B26F
color11 #E8C88D
# синий
color4  #6F9BE8
color12 #8DB3F5
# фиолетовый (акцент, в цвет обоев)
color5  #9B72E6
color13 #B79CFF
# бирюзовый
color6  #5FB3B3
color14 #7FCFCF
# белый
color7  #C8C8D0
color15 #ECECF1
